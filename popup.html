<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Keyboard Remap</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="shared.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="popup">
      <section class="hero">
        <div class="hero__copy">
          <h1>ChatGPT Keyboard Remap</h1>
        </div>

        <label class="toggle" for="enabled-toggle">
          <span class="toggle__text">Enabled</span>
          <span class="toggle__control">
            <input id="enabled-toggle" type="checkbox" />
            <span class="toggle__track" aria-hidden="true">
              <span class="toggle__thumb"></span>
            </span>
          </span>
        </label>
      </section>

      <section class="panel panel--settings">
        <div class="setting">
          <div class="setting__header">
            <div>
              <h2 class="setting__title">Send message</h2>
            </div>
          </div>
          <div
            class="shortcut-grid"
            id="send-shortcuts"
            role="radiogroup"
            aria-label="Shortcut used to send a message"
          ></div>
        </div>

        <div class="setting">
          <div class="setting__header">
            <div>
              <h2 class="setting__title">Insert newline</h2>
            </div>
          </div>
          <div
            class="shortcut-grid"
            id="newline-shortcuts"
            role="radiogroup"
            aria-label="Shortcut used to insert a newline"
          ></div>
        </div>
      </section>

      <a
        class="repo-link"
        href="https://github.com/iIQOverflow/chatgpt-keyboard-remap"
        target="_blank"
        rel="noreferrer"
        aria-label="Open the GitHub repository"
      >
        <span class="repo-link__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path
              d="M12 2C6.48 2 2 6.58 2 12.23c0 4.52 2.87 8.35 6.84 9.71.5.1.68-.22.68-.49 0-.24-.01-1.04-.01-1.88-2.78.62-3.37-1.21-3.37-1.21-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.35 1.12 2.92.86.09-.67.35-1.12.63-1.38-2.22-.26-4.55-1.14-4.55-5.09 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.74 0 0 .85-.28 2.78 1.05A9.45 9.45 0 0 1 12 6.83c.85 0 1.71.12 2.51.36 1.92-1.33 2.77-1.05 2.77-1.05.55 1.43.2 2.48.1 2.74.64.72 1.03 1.63 1.03 2.75 0 3.96-2.33 4.82-4.56 5.08.36.32.68.95.68 1.92 0 1.39-.01 2.5-.01 2.84 0 .27.18.6.69.49A10.25 10.25 0 0 0 22 12.23C22 6.58 17.52 2 12 2Z"
            ></path>
          </svg>
        </span>
        <span class="repo-link__copy">
          <span class="repo-link__title">Open Source Project</span>
          <span class="repo-link__description">View on GitHub</span>
        </span>
        <span class="repo-link__arrow" aria-hidden="true">→</span>
      </a>
    </main>
  </body>
</html>
